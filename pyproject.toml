[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-freedomspeech"
dynamic = ["version"]
description = "Agent Framework plugin for Freedom Speech: Kazakh, Russian and English STT and TTS."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "Freedom Speech" }]
keywords = ["voice", "ai", "realtime", "audio", "livekit", "freedomspeech", "kazakh", "russian"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["livekit-agents[codecs]>=1.8.8"]

[project.urls]
Documentation = "https://freedomspeech.kz/docs"
Website = "https://freedomspeech.kz"
Source = "https://github.com/livekit/agents"

[tool.hatch.version]
path = "livekit/plugins/freedomspeech/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]
